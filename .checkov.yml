# What is left after fixing everything worth fixing. Each skip is a decision, not a
# silenced alarm, and each one would be revisited before this ran in a real account.
directory:
  - terraform
quiet: true
compact: true
skip-check:
  # No KMS in this project. Every service uses its own managed encryption, which is a
  # real decision on a local emulator and a discussion about key policies anywhere else.
  - CKV_AWS_145  # S3 encrypted with a customer managed key
  - CKV_AWS_136  # ECR encrypted with a customer managed key
  - CKV_AWS_149  # Secrets Manager encrypted with a customer managed key
  - CKV_AWS_158  # CloudWatch log group encrypted with a customer managed key
  - CKV_AWS_173  # Lambda environment variables encrypted with a customer managed key

  # There is no certificate authority in an emulator, so the load balancer speaks HTTP.
  - CKV_AWS_2    # ALB listener uses HTTPS
  - CKV_AWS_103  # ALB uses TLS 1.2 or better
  - CKV_AWS_378  # target group uses HTTPS
  - CKV2_AWS_20  # ALB redirects HTTP to HTTPS

  # Durability and availability features that cost money and prove nothing locally.
  - CKV_AWS_144  # S3 cross region replication
  - CKV_AWS_157  # RDS multi availability zone
  - CKV_AWS_293  # RDS deletion protection
  - CKV_AWS_150  # ALB deletion protection
  - CKV_AWS_353  # RDS performance insights
  - CKV2_AWS_30  # RDS query logging beyond the exports already enabled
  - CKV_AWS_338  # a year of log retention

  # Logging that needs somewhere to log to. A second bucket for access logs, and flow
  # logs for a VPC nothing routes through, would be scaffolding rather than security.
  - CKV_AWS_18   # S3 access logging
  - CKV_AWS_91   # ALB access logging
  - CKV2_AWS_11  # VPC flow logs

  # Lifecycle and notification rules for a bucket that holds a few CSV files.
  - CKV2_AWS_61  # S3 lifecycle configuration
  - CKV2_AWS_62  # S3 event notifications

  # The image tag is a hash of the image contents, so a rebuild of unchanged code pushes
  # the same tag on purpose. Immutable tags would turn that into an error.
  - CKV_AWS_51   # ECR immutable image tags

  # Rotation needs a rotation function and a story about downtime. Out of scope here,
  # and the password is already generated by Terraform and never written to state.
  - CKV2_AWS_57  # Secrets Manager automatic rotation

  # Code signing needs a signing profile in a real account.
  - CKV_AWS_272  # Lambda code signing

  # The handlers reach RDS and the emulator endpoint from outside a VPC. In a real
  # account they would sit in private subnets with a NAT gateway.
  - CKV_AWS_117  # Lambda inside a VPC
  - CKV_AWS_116  # Lambda dead letter queue: failures are redriven by the SQS queue itself

  # Checkov cannot see the security group being passed into a module, so it reports it
  # as unattached. It is attached to the database, the tasks and the load balancer.
  - CKV2_AWS_5   # security group attached to a resource

  # The default security group belongs to the VPC, not to this configuration.
  - CKV2_AWS_12  # default security group restricts all traffic

  # Enhanced monitoring needs a monitoring role and an agent that reports to CloudWatch.
  # There is nothing on the other end of it here.
  - CKV_AWS_118  # RDS enhanced monitoring
