name: payments

services:
  floci:
    image: floci/floci:2.1.0
    ports:
      - "4566:4566"
      - "7001-7099:7001-7099" # RDS is advertised on one of these, never on 5432
      - "8088:80"             # the ALB listener binds inside this container, not on the host
    environment:
      # Unset, Floci puts "localhost" in every URL it hands out, which any other
      # container resolves to itself.
      FLOCI_HOSTNAME: floci
      # Lambda, RDS and ECS containers join this network so they can reach `floci`.
      FLOCI_SERVICES_DOCKER_NETWORK: payments_default
      FLOCI_SERVICES_RDS_ENDPOINT_HOST: floci
      # Task-role credentials need this one specifically; the global variable above is
      # not enough. Floci does not vend them yet either way, see README.
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: payments_default
      FLOCI_SERVICES_ECS_TASK_ROLE_CREDENTIALS_ENABLED: "true"
      # Off by default, and without it every IAM policy in terraform/ is decoration.
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
      FLOCI_STORAGE_MODE: memory
      QUARKUS_LOG_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
