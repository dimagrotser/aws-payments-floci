[project]
name = "payments"
version = "0.1.0"
description = "Event-driven transaction processing on AWS"
# Pinned to the version the Lambda runtime runs, so the tests and the deployed code
# agree on the language they are written in.
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
# Everything the Lambda zips carry. Pure Python only: Floci pulls the arm64 runtime
# image on this laptop and the amd64 one in CI, and a compiled wheel would only fit one
# of them. boto3 comes with the runtime image, so it is a dev dependency, not a bundled one.
lambda = [
    "sqlalchemy>=2.0.40",
    "pg8000>=1.31.5",
]
api = [
    "fastapi>=0.120.0",
    "uvicorn>=0.38.0",
    "pydantic>=2.12.0",
    "boto3>=1.40.0",
    "sqlalchemy>=2.0.40",
    "pg8000>=1.31.5",
]
dev = [
    "alembic>=1.16.0",
    "boto3>=1.40.0",
    "pytest>=8.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.14.0",
]

[tool.uv]
# The lambda group holds the runtime dependencies of the handlers, so the local
# environment needs it too, not just the zips.
default-groups = ["dev", "lambda", "api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Imports come from src/ directly rather than from the editable install. On macOS uv
# writes its .pth file with the hidden flag set and CPython skips hidden .pth files,
# so the editable install stops working at random after a reinstall.
pythonpath = ["src"]
markers = ["integration: talks to Floci, needs make up && make deploy"]
timeout = 180
